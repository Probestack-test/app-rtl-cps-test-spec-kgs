_format_version: "3.0"
_transform: true

########################################################
# SERVICES
########################################################

services:
  - name: test-spec
    host: test-spec
    port: 443
    protocol: https
    path: /api
    retries: 5
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    routes:
      - name: test-spec-get-api-v1-payments-forecast
        protocols:
          - https
          - http
        methods:
          - GET
        hosts:
          - api.example.com
        paths:
          - /api/v1/payments/forecast
        strip_path: true
        preserve_host: false
        https_redirect_status_code: 426

########################################################
# PLUGINS
########################################################

plugins:
  - name: rate-limiting
    service: test-spec
    enabled: true
    protocols:
      - http
      - https
    config:
  - name: key-auth
    service: test-spec
    enabled: true
    protocols:
      - http
      - https
    config:

########################################################
# UPSTREAMS + TARGETS
########################################################

upstreams:
  - name: test-spec
    algorithm: round-robin
    slots: 10000
    targets:
      - target: api.example.com:443
        weight: 100
